---
layout: single
---
{% assign project = site.data.projects | where: "slug", page.project_key | first %}
<div class="academic-project">
  <p class="academic-project__field">{{ project.field }} / Research &amp; Engineering</p>
  <p class="academic-project__summary">{{ project.summary }}</p>
  <dl class="academic-project__facts">
    <div><dt>当前进展</dt><dd>{{ project.status }}</dd></div>
    <div><dt>关键词</dt><dd>{{ project.tags | join: ' · ' }}</dd></div>
  </dl>
  {{ content }}
  <p class="academic-project__back"><a href="{{ '/portfolio/' | relative_url }}">← 返回研究项目</a></p>
</div>
